name: csharp-ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build csharp/YaneuraOu.CSharp.sln -v minimal
      - name: Test
        run: dotnet test csharp/YaneuraOu.CSharp.sln -v minimal
      - name: Bench Smoke
        run: dotnet run --project csharp/src/YaneuraOu.CSharp.Engine/YaneuraOu.CSharp.Engine.csproj -- bench 1 2
